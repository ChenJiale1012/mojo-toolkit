<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4"><link rel="alternate icon" type="image/png" sizes="32x32" href="/icons/favicon.png?v=4"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4"><link rel="manifest" href="/site.webmanifest?v=4"><meta property="og:title" content="Mojo Brand Toolkit"><meta property="og:description" content="Mojo. Better together. Internal brand reference and working resources."><meta property="og:image" content="/icons/link-preview.png?v=4"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="theme-color" content="#FFF8F0"><meta name="description" content="An internal reference for Mojo brand guidance, approved assets, supplied resources and implementation examples."><title>Mojo — Brand toolkit</title><link rel="preload" href="/fonts/MojoPixelSerif-Draft-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/brand/mojo-cat-transparent.svg" as="image">
<style>
body{margin:0;background:#FFF8F0}
#brand-intro{position:fixed;inset:0;z-index:100;background:#FFF8F0;display:grid;place-items:center;pointer-events:none}
#brand-intro .intro-skip{position:absolute;bottom:30px;right:30px;background:none;border:0;color:#68635B;font:11px Arial,sans-serif;padding:12px;pointer-events:auto;cursor:pointer}
#brand-intro .intro-skip:focus-visible{outline:2px solid #35594A;outline-offset:5px}
</style>
</head><body><div id="app"></div><script>
// Start the cover in the HTML, before the deferred application bundle renders.
// A missing bundle, slow asset, or blocked storage must never trap the visitor.
(()=>{
  const key='mojo-brand-intro-seen';
  try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch{}
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  if(motion.matches)return;
  const cover=document.createElement('div');cover.id='brand-intro';cover.className='brand-intro';
  cover.setAttribute('aria-label','Mojo brand introduction');
  const skip=document.createElement('button');skip.className='intro-skip';skip.textContent='Skip intro';
  cover.append(skip);document.body.append(cover);
  const listeners=new AbortController();
  const dismiss=()=>cover.dispatchEvent(new Event('intro-dismiss'));
  const watchdog=setTimeout(dismiss,1800);
  cover.addEventListener('intro-dismiss',()=>{clearTimeout(watchdog);listeners.abort();cover.remove()},{once:true});
  skip.addEventListener('click',dismiss,{signal:listeners.signal});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Tab')dismiss()},{signal:listeners.signal});
  window.addEventListener('pagehide',dismiss,{signal:listeners.signal});
  motion.addEventListener('change',e=>{if(e.matches)dismiss()},{signal:listeners.signal});
})();
</script>
<script type="module" src="/src/main.js"></script></body></html>
